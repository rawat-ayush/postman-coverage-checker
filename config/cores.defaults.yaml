# Default configuration for the Postman coverage checker.
#
# Source of YAMLs: https://github.com/Fiserv/banking-hub/tree/Develop-InWork/reference
# Each core points at its own folder under `reference/`.
#
# SECURITY: this file holds tokens once you fill them in. Either keep a
# CHANGE_ME copy committed and put real secrets in `config/cores.local.yaml`
# (already gitignored), or gitignore this file entirely.

cores:
  PRM:
    name: Premier
    github:
      owner: Fiserv
      repo: banking-hub
      path: reference/Premier
      branch: Develop-InWork
    postman_collection_id: 52332743-70a7af9c-041a-436a-9f1c-3afe6a2f0128

  SIG:
