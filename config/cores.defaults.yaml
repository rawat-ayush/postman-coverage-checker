# ---------------------------------------------------------------------------
# Matcher tables
# ---------------------------------------------------------------------------
# For every YAML the parser extracts (Service, Action, Type) from the file
# name. The matcher then looks for a Postman folder whose name contains any
# of the subject tokens for that Service, and a request inside that folder
# whose name contains an action synonym and (optionally) a type synonym.

# YAML `Service` token -> keyword(s) expected in the Postman folder name.
service_subject_map:
  # ----- accounts -----
  AcctService:                              [account]
  AccountService:                           [account]
  AcctHoldService:                          [account hold, hold]
  AccountHoldService:                       [account hold, hold]
  StopHoldService:                          [stop hold]
  AcctTrnService:                           [account transaction, transaction, txn]
  AccountTransactionService:                [account transaction, transaction, txn]
  AccountTransactionHistoryService:         [account transaction history, transaction history]
  TxnService:                               [transaction, txn]
  TransactionService:                       [transaction, txn]
  AcctCollateralRelService:                 [account collateral, collateral]
  AccountCollateralRelationshipService:     [account collateral, collateral]
  AccountCollateralService:                 [account collateral, collateral]
  AcctDocTypeRelService:                    [account document, document type]
  AccountDocumentTypeRelationshipService:   [account document, document type]
  AccountDistributionService:               [account distribution, distribution]
  AccountDistibutionService:                [account distribution, distribution]  # typo in Postman
  AccountPayOffService:                     [account pay off, payoff, pay off]
  AccountPayOff:                            [account pay off, payoff, pay off]
  AcctPayOffService:                        [account pay off, payoff, pay off]
  MultiAcctService:                         [multi account]
  MultiAccountService:                      [multi account]
  ValidateAccountService:                   [validate account, validate]

  # ----- transfers / payments -----
  XferService:                              [transfer, xfer]
  TransferService:                          [transfer, xfer]
  PaymentsService:                          [payments, payment]
  ACHExternalAccountTransferService:        [ach external account transfer, ach, external transfer]

  # ----- accountholder / party -----
  AddressService:                           [address, addr]
  AddrService:                              [address, addr]
  PartyService:                             [party]
  PartyPartiesService:                      [party parties, party]
  PartyAcctRelService:                      [party account]
  PartyAccountRelationshipService:          [party account]
  PartyAcctService:                         [party account]
  PartyAccountService:                      [party account]
  BeneficialOwnerService:                   [beneficial owner, beneficial]
  BeneficiaryService:                       [beneficiary]

  # ----- cards -----
  CardService:                              [card]
  CardTokenService:                         [card token, card]
  CardAcctRelService:                       [card account relationship, card account]
  CardAccountRelationshipService:           [card account relationship, card account]
  CardAcctRelSpecService:                   [card account relationship specification]
  CardAccountRelationshipSpecificationService: [card account relationship specification]
  CardTokenAcctRelService:                  [card token, card account]

  # ----- servicing -----
  BranchService:                            [branch]
  ClientDefinedFieldService:                [client defined field]
  ClientFieldSpecService:                    [client field spec, client field specification, client field specifications]
  ClientFieldSpecificationService:          [client field spec, client field specification, client field specifications]
  EnumTableService:                         [enum table, enumeration]
  EnumerationTableService:                  [enumeration]
  HolidayService:                           [holiday]
  HostSystemService:                        [host system]
  HostLogonService:                         [host logon]
  ServicingService:                         [servicing]
  MemoTicklerService:                       [memo tickler, memo, tickler]
  RestrictionService:                       [restriction]
  AutoEnrollmentService:                    [auto enrollment, enrollment]
  ProductService:                           [product]
  ProductSpecificationService:              [product specification, product specifications]
  DocumentService:                          [document]
  DocumentPreferencesService:               [document preferences]
  StopChkService:                           [stop check, stop chk]
  StopCheckService:                         [stop check]
  StopItemService:                          [stop item]

  # ----- transactions extras -----
  CreditService:                            [credit]
  CreditAddService:                         [credit add]
  CreditLineService:                        [credit line]
  DebitService:                             [debit]

  # ----- collateral / loans / other -----
  CollateralService:                        [collateral]
  CollateralItemService:                    [collateral item]
  LoanService:                              [loan]
  IndirectLiabilityService:                 [indirect liability]
  LoanIndirectLiabilityService:             [indirect liability]
  OwnershipService:                         [ownership]
  OwnerShipService:                         [ownership]
  ParticipationService:                     [participation]
  CombinedStatementService:                 [combined statement]
  eAgreementService:                        [eagreement, agreement]

  # ----- portfolio / party-portfolio -----
  PortfolioService:                         [portfolio]
  PortfolioAddrService:                     [portfolio]
  PortfolioAddressService:                  [portfolio]
  PortPartyRelService:                      [portfolio, party]
  PartyPortRelService:                      [portfolio, party]
  PartyPartyRelService:                     [party parties, party]
  ProdListService:                          [product list, product]
  ProductInterestRateService:               [product interest rate]

  # ----- misc products / accounts -----
  EscrowService:                            [escrow]
  RenewalService:                           [renewal]
  SweepService:                             [sweep]
  SafeDepositBoxService:                    [safe deposit box, sdb]
  SafeDepositBoxInvService:                 [safe deposit box, sdb]
  TaxFormsService:                          [tax forms, tax]
  ePreferenceService:                       [epreferences, epreference, preferences]
  RegionService:                            [region]
  region-service:                           [region]

# YAML `Action` token -> verb synonyms used in Postman request names.
action_synonyms:
  Add:     [add, create, new, post]
  Inq:     [get, inquire, inquiry, fetch, retrieve, read, view]
  ListInq: [list, listinq, list inquiry, inquire list]
  Mod:     [update, modify, edit, change, put, patch]
  Del:     [delete, remove]

# YAML `Type` token -> synonyms in Postman request names.
type_synonyms:
  DDA:       [dda]
  CDA:       [cda]
  SDA:       [sda]
  DDL:       [ddl]
  LOAN:      [loan]
  Loan:      [loan]
  CARD:      [card]
  DEPOSIT:   [deposit, deposits]
  DEPOSITS:  [deposit, deposits]
  Deposit:   [deposit, deposits]
  Deposits:  [deposit, deposits]
  Immediate: [immediate]
  Recurring: [recurring]
  Recur:     [recurring, recur]
  AMS:       [ams]
  SDB:       [sdb]
  Teller:    [teller]
  Party:     [party]
  Acct:      [account, acct]

matcher:
  # RapidFuzz score (0-100) below which a candidate is NOT reported as a
  # suggestion for an unmatched YAML.
  suggestion_min_score: 55
